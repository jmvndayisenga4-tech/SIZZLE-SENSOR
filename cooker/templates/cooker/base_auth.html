{% load static %}<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1410">
<title>{% block title %}Sizzle Sense{% endblock %}</title>
<link rel="manifest" href="{% url 'manifest' %}">
<link rel="icon" href="{% url 'icon_svg' %}" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#1c1410;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.1);--tx:#f6efe9;--mu:#b0a198;--fire:#ff6b2c;--amb:#ffb02e;--mint:#3ddbb4;--rose:#ff5d5d;--track:rgba(255,255,255,.1);--shadow:0 18px 40px rgba(0,0,0,.35)}
[data-bs-theme=light]{--bg:#fbf4ee;--card:rgba(255,255,255,.8);--card2:#fff;--line:rgba(60,30,10,.12);--tx:#2b1a10;--mu:#7d6a5d;--track:rgba(60,30,10,.1);--shadow:0 14px 30px rgba(120,60,20,.12)}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',system-ui,sans-serif;color:var(--tx);min-height:100vh;
background:radial-gradient(800px 480px at 0 -5%,rgba(255,107,44,.2),transparent 60%),radial-gradient(700px 500px at 100% 0,rgba(255,176,46,.12),transparent 60%),var(--bg);background-attachment:fixed}
a{color:var(--fire);text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;color:#fff;background:linear-gradient(135deg,#ff8a4c,#f2541b);box-shadow:0 8px 22px rgba(242,84,27,.45)}
h1,h2{font-family:'Fraunces',Georgia,serif;margin:0}
h1{font-size:1.3rem;font-weight:800}h1 span{color:var(--fire)}
.sub{font-size:.78rem;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:20px}
.auth{max-width:420px;margin:6vh auto 0}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mu);margin:14px 0 6px}
input[type=text],input[type=password],input[type=email]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;outline:none}
input:focus{border-color:var(--fire);box-shadow:0 0 0 3px rgba(255,107,44,.25)}
small,.help{display:block;font-size:.74rem;color:var(--mu);margin-top:6px}.help ul{margin:4px 0 0;padding-left:18px}
.err{color:#ff8f8f;font-size:.8rem;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff8a4c,#f2541b);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.full{width:100%;margin-top:20px}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.btn.sm{padding:8px 12px;font-size:.82rem;border-radius:12px}
.btn.danger{background:var(--card2);color:var(--rose);border:1px solid var(--line)}
.alt{text-align:center;margin-top:18px;font-size:.88rem;color:var(--mu)}
.msg{padding:12px 14px;border-radius:14px;margin-bottom:14px;background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.4);font-size:.88rem}
.msg.success{background:rgba(61,219,180,.12);border-color:rgba(61,219,180,.45)}
.pend{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.pend:first-of-type{border-top:0}
.pend .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff8a4c,#f2541b);flex:none}
.pend .who{min-width:0;flex:1}.pend .who b{display:block;word-break:break-all}.pend form{display:contents}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;font-size:.75rem;font-weight:700;color:#fff;background:var(--fire)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ck{display:flex;flex-direction:column;gap:12px}
.ck .row{display:flex;align-items:center;gap:12px}
.ck .ic{font-size:2rem;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.ck h2{font-size:1.1rem;line-height:1.2;word-break:break-word}
.pill{margin-left:auto;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--mu)}
.pill.on{background:linear-gradient(135deg,#ffa12e,#f2760f);color:#fff;border-color:transparent}.pill.rdy{background:rgba(61,219,180,.18);color:var(--mint);border-color:var(--mint)}
.bar{height:7px;border-radius:99px;background:var(--track);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff6b2c,#ffb02e)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mu)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts form{display:contents}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details form{display:flex;gap:8px;margin-top:10px}details input{padding:9px 12px}
.new{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.new input{flex:1;min-width:180px}
.empty{text-align:center;padding:36px 12px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>try{var t=localStorage.getItem('ss-theme');if(t)document.documentElement.dataset.bsTheme=t}catch(e){}</script>
</head>
<body><div class="wrap">{% block content %}{% endblock %}</div></body>
</html>
